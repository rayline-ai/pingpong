# Overlay for REVIEWER_MODE=codex-sub. `pingpong up` adds it with a second -f
# when .env asks for that mode; it does nothing on its own and is not part of the
# default stack.
#
# Nothing from the operator's ~/.codex is mounted, and that is the point. Codex
# rotates its refresh token on every refresh and Hermes does not write the new
# one back, so sharing that file would work exactly once and then leave the
# operator's own `codex` CLI holding a revoked token — a failure that lands on
# their terminal, not on this stack's logs. Hermes could not read it anyway: it
# keeps credentials in its own auth.json format, and `hermes import-agent codex`
# says outright that credentials are never imported. The agent gets a session of
# its own instead, created once by `./pingpong login`.
#
# HERMES_HOME, not a mount over /root/.hermes. Hermes writes auth.json by atomic
# replace, so nothing narrower than a directory survives a refresh — and the
# image's /root/.hermes is 295MB of populated content that a mount would freeze
# at first boot. A separate home is small (~100KB), the entrypoint creates it,
# Hermes fills in what it needs on first use, and the image keeps updating.
#
# It is in `environment:` rather than exported by the entrypoint because
# `docker exec` does not inherit the entrypoint's shell — and `docker exec` is
# how every round actually runs.
#
# A host directory rather than a named volume, because the sign-in is an
# interactive device-code flow: on a volume, `docker compose down -v` — a
# routine thing to type — turns a one-time step into a once-per-teardown step.
# REVIEWER_SESSION_DIR is written into .env by `up` (src/subscription.py) and
# points inside the operator's profile, for the same reason CREDENTIALS_DIR is:
# compose interpolates .env and cannot expand `~`, and $HOME is routinely unset
# on Windows.
#
# Per role, and never applied to a role that is not in this mode: doing so would
# move that agent's Hermes home somewhere empty, which looks like a working
# container right up until it is asked to think. See reviewer.claude-sub.yml for
# why there are four of these files.

services:

  reviewer:
    environment:
      HERMES_HOME: /hermes
    volumes:
      # A directory of its own, so that if the coder is on codex-sub too the two
      # hold separate OAuth grants. One shared grant would put both agents on a
      # single rotating refresh token, and whichever refreshed second would find
      # its copy revoked.
      - ${REVIEWER_SESSION_DIR:?set REVIEWER_MODE=codex-sub in .env and run ./pingpong up, which fills this in}:/hermes
